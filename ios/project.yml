name: StoryTeller
options:
  bundleIdPrefix: com.storyteller
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  StoryTeller:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StoryTellerApp.swift
      - path: Models
      - path: Services
      - path: Views
      - path: Assets.xcassets
      - path: Resources
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: WebKit.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreText.framework
      - sdk: AudioToolbox.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: StoryTeller
        PRODUCT_BUNDLE_IDENTIFIER: com.storyteller.app
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/StoryTeller.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        MARKETING_VERSION: "1.0.17"
        CURRENT_PROJECT_VERSION: "17"
        GENERATE_INFOPLIST_FILE: NO
